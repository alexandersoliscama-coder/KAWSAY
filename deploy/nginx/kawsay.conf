# KAWSAY detrás de nginx. La app solo acepta Host/Origin 127.0.0.1:4180, por eso se reescriben.
# La app NO tiene autenticación y acepta escrituras: se protege con contraseña (basic auth).
server {
    listen 80;
    server_name __DOMINIO__;

    auth_basic "KAWSAY";
    auth_basic_user_file /etc/nginx/.kawsay-htpasswd;

    location / {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:4180;
        proxy_set_header Origin http://127.0.0.1:4180;
        proxy_read_timeout 300s;
        client_max_body_size 1m;
    }
}
