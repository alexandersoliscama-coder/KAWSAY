<style>
:root{color-scheme:dark;--bg:#071525;--panel:#10253a;--line:#29475d;--text:#eef5fc;--muted:#a8bdcf;--cyan:#36e2e5;--green:#86ebbc;--amber:#ffd58a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0,#123850 0,transparent 48%),var(--bg);color:var(--text);font:15px/1.55 system-ui,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}button{cursor:pointer;color:inherit;background:#142d43;border:1px solid var(--line);border-radius:12px;padding:11px 17px;min-height:46px}button:hover{border-color:var(--cyan);background:#1b3c50}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}a{color:var(--cyan)}.primary{background:var(--cyan);border-color:var(--cyan);color:#06202a;font-weight:750}.primary:hover{background:#8cf4ef}.ghost{background:transparent}.badge{display:inline-flex;align-items:center;gap:7px;border:1px solid #397578;background:#103c42;color:#9df4df;padding:5px 10px;border-radius:99px;font-size:12px}.amber{background:#3a3020;border-color:#7c6137;color:var(--amber)}.muted,small{color:var(--muted)}small{font-size:12px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);font-weight:700}h1,h2,h3,p{margin:0 0 12px}h1{font-size:clamp(26px,3vw,36px);letter-spacing:-1px;line-height:1.2}h2{font-size:20px;letter-spacing:-.4px}h3{font-size:16px}header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:15px 28px;border-bottom:1px solid var(--line);background:#091928f2;backdrop-filter:blur(14px)}.brand{display:flex;gap:12px;align-items:center}.logo{font-size:25px;font-weight:850;letter-spacing:2px}.orbit{width:34px;height:22px;border:2px solid var(--cyan);border-radius:50%;transform:rotate(-28deg);position:relative}.orbit:after{content:'';position:absolute;width:8px;height:8px;background:white;border-radius:50%;right:0;top:-4px}.roles{display:flex;background:#071725;border:1px solid var(--line);border-radius:12px;padding:3px}.roles button{font-size:13px;border:0;background:none;min-height:38px;padding:8px 13px}.roles button[aria-pressed=true]{background:#184451;color:var(--cyan)}.header-end{display:flex;align-items:center;gap:16px}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);max-width:1700px;margin:auto;min-height:calc(100vh - 85px)}nav{border-right:1px solid var(--line);padding:27px 15px;position:sticky;top:84px;align-self:start;height:calc(100vh - 84px)}nav button{width:100%;display:flex;gap:13px;align-items:center;text-align:left;margin-bottom:8px;background:transparent;border-color:transparent;font-size:14px}nav button[aria-current=page]{background:linear-gradient(90deg,#16454e,#0c2434);color:var(--cyan);border-color:#2c777b}svg.icon{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.nav-note{border-top:1px solid var(--line);margin-top:22px;padding:20px 10px;font-size:11px;color:var(--muted)}main{padding:32px 36px 20px;min-width:0}.page-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.page-head p{color:var(--muted);margin:8px 0 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.card{background:linear-gradient(125deg,#142c42ed,#0d2032f2);border:1px solid var(--line);border-radius:17px;padding:23px;min-width:0}.metric{text-align:left;display:block;width:100%}.metric .value{font-size:31px;font-weight:750;letter-spacing:-1px;color:var(--green);margin:10px 0 2px}.value small{font-size:14px;letter-spacing:0;color:var(--green)}.metric p{font-size:13px;color:var(--muted)}.metric small{display:block}.metric svg{color:var(--cyan);float:right}.spark{height:25px;width:100%;margin-top:10px}.spark path{stroke:var(--cyan);fill:none;stroke-width:2}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.actions>*{flex:1}.stack{display:grid;gap:16px}.summary{border-left:3px solid var(--cyan)}.steps{list-style:none;padding:0;margin:10px 0}.steps li{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.steps li:last-child{border:0}.num{width:25px;height:25px;background:#13454d;color:var(--cyan);display:grid;place-items:center;border-radius:50%;flex:none;font-size:13px}.mini-earth{position:relative;overflow:hidden;min-height:235px;display:flex;align-items:center;gap:18px;background:radial-gradient(ellipse at bottom right,#1a6171,transparent 65%),#0d2032}.mini-earth svg{height:200px;width:140px;flex:none}.mini-earth div{position:relative}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.tabs button[aria-selected=true]{background:#16464f;color:var(--cyan);border-color:#35b4b7}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:8px;min-width:0;font-size:13px;font-weight:650}.wide{grid-column:1/-1}input,select,textarea{width:100%;min-width:0;min-height:46px;border:1px solid #426078;border-radius:9px;background:#0a1d2f;color:var(--text);padding:11px}textarea{resize:vertical;min-height:100px}input[type=range]{padding:0;accent-color:var(--cyan)}.form-shell{max-width:930px;margin:auto}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.list-row{padding:17px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border:0}.list-row p{margin:4px 0}.crew{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:24px}.crew button{text-align:left}.crew button.selected{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#1e4457;color:var(--cyan);font-weight:800;margin-bottom:15px}.crew .badge{margin-top:10px}.chart{width:100%;height:auto;display:block;max-height:230px}.chart text{fill:var(--muted);font:12px system-ui}.chart .gridline{stroke:#2c4357;stroke-width:1}.chart .curve{stroke:var(--cyan);stroke-width:3;fill:none}.chart circle{fill:var(--cyan)}.explore{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}.stage{position:relative;min-height:500px;display:flex;justify-content:center;align-items:center;background:radial-gradient(ellipse at 50% 85%,#174655,transparent 60%);border-radius:15px}.astronaut{height:440px;width:270px;max-width:100%}.zone{position:absolute;background:#092c3ee6;border-color:var(--cyan);font-size:12px;padding:7px 12px}.zone.active{box-shadow:0 0 20px #36e2e533}.zone[data-zone=Muslo]{top:64%;left:12%}.zone[data-zone=Tórax]{top:35%;right:6%}.zone[data-zone=Cabeza]{top:7%;left:10%}.anatomy{height:180px;width:100%;background:radial-gradient(ellipse,#214256,transparent);margin:8px 0}.toggle{display:flex;gap:8px}.toggle button{flex:1}.toggle button[aria-pressed=true]{border-color:var(--cyan);color:var(--cyan)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:14px 10px}th{color:var(--muted);font-weight:500}.footer{font-size:11px;color:var(--muted);text-align:center;margin:30px 0 12px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);z-index:40;max-width:calc(100% - 24px);background:#153e48;border:1px solid var(--cyan);border-radius:12px;padding:15px 22px;box-shadow:0 10px 50px #0008}.toast:empty{display:none}dialog{color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:20px;width:min(570px,calc(100% - 24px));padding:28px}dialog::backdrop{background:#000b;backdrop-filter:blur(5px)}dialog .actions{margin-top:24px}.empty{text-align:center;padding:35px 10px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.toolbar select{width:auto}.storage-warning{padding:12px;border:1px solid #7c6137;color:var(--amber);border-radius:10px;margin-bottom:16px}[hidden]{display:none!important}@media(min-width:1500px){main{padding:40px 50px}}@media(max-width:1100px){.metrics,.crew{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:180px minmax(0,1fr)}main{padding:25px}.header-end .badge{display:none}.explore{grid-template-columns:1fr}.stage{min-height:420px}.astronaut{height:390px}}@media(max-width:760px){header{padding:12px 16px;flex-wrap:wrap;gap:10px;position:relative}.brand small{display:none}.logo{font-size:21px}.header-end{gap:8px}.roles button{font-size:12px;padding:7px 9px}.layout{display:block;min-height:0}nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:20;border-right:0;border-top:1px solid var(--line);background:#091928f5;backdrop-filter:blur(16px);padding:6px 8px max(7px,env(safe-area-inset-bottom));display:flex;gap:2px}nav button{flex:1;min-width:0;min-height:54px;padding:5px 2px;display:flex;flex-direction:column;gap:3px;font-size:10px;text-align:center;margin:0;border-radius:9px}nav .nav-note{display:none}nav button.secondary-nav{display:none}main{padding:23px 16px 85px}.grid,.form-grid{grid-template-columns:1fr}.metrics,.crew{gap:10px}.card{padding:17px;border-radius:14px}.page-head{align-items:flex-start}.page-head h1{font-size:27px}.page-head p{font-size:13px}.page-head .badge{font-size:10px;padding:5px 7px}.metric .value{font-size:26px}.metric p{font-size:12px}.metric small{font-size:10px}.metric svg.icon{width:19px}.metric .spark{height:18px}.mini-earth{min-height:220px}.mini-earth svg{width:110px}.stage{min-height:390px}.astronaut{height:370px}.actions button{min-width:130px}.toast{bottom:85px}.toolbar{gap:8px}.toolbar button{padding:9px 12px}.footer{font-size:10px}.crew .badge{font-size:10px}.orbit{width:27px;height:18px}}@media(max-width:350px){.brand{gap:7px}.roles button{font-size:11px;padding:6px}.logo{font-size:18px}.metric .value{font-size:23px}main{padding-left:10 </style>

<body>
<header><div class="brand"><span class="orbit" aria-hidden="true"></span><span class="logo">KAWSAY</span><small>Salud en misión</small></div><div class="header-end"><span class="badge">DEMO · DATOS SIMULADOS</span><div class="roles" aria-label="Perfil de demostración"><button data-role="astronauta" aria-pressed="true">Astronauta</button><button data-role="medico" aria-pressed="false">Personal médico</button></div></div></header>
<div class="layout"><nav id="nav" aria-label="Navegación principal"></nav><main id="main" tabindex="-1"></main></div>
<dialog id="detail"><div id="detail-body"></div><div class="actions"><button id="close-detail" class="primary">Cerrar detalle</button></div></dialog><div class="toast" role="status" aria-live="polite" id="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const paths={home:'M3 10 12 3l9 7M5 9v12h5v-7h4v7h5V9',report:'M16 3l5 5-12 12-6 1 1-6zM13 6l5 5',alert:'M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4',analysis:'M4 20V11M10 20V4M16 20V8M22 20V2',body:'M9 5a3 3 0 1 0 6 0 3 3 0 1 0-6 0M8 22l1-9-4 4M16 22l-1-9 4 4M9 10h6',history:'M4 4v6h6M4 10a9 9 0 1 1 1 8M12 7v6l4 2',heart:'M2 12h5l3-8 4 16 3-8h5',oxygen:'M11 5v9c-7-6-10-1-8 4 1 3 6 3 8-1M13 5v9c7-6 10-1 8 4-1 3-6 3-8-1',pressure:'M4 3h13v12H4zM7 6h7M10 15v6h9v-9',temp:'M10 14V4a2 2 0 0 1 4 0v10a5 5 0 1 1-4 0M12 8v10',crew:'M8 9a3 3 0 1 0 0-6 3 3 0 1 0 0 6M2 21v-4a6 6 0 0 1 12 0v4M17 4a3 3 0 0 1 0 6M17 13a5 5 0 0 1 5 5v3',arrow:'M5 12h14M13 6l6 6-6 6',check:'M4 12l5 5L20 6'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.analysis}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let storageOK=true,records=[],alertStates={},draft={type:'Síntomas',symptom:'Fatiga muscular',zone:'Muslo derecho',intensity:'4',since:'',notes:'',sleep:'',activity:'',measurement:'',unit:'mmHg'};
try{const d=JSON.parse(localStorage.getItem('kawsay-ui-v1')||'{}');records=Array.isArray(d.records)?d.records:[];alertStates=d.alertStates||{};draft={...draft,...d.draft};}catch{storageOK=false}
let role='astronauta',page='home',crew='01',zone='Muslo',layer='Traje',period='today',alertFilter='all';
const crewData=[{id:'01',name:'Astronauta 01',initial:'A1',pa:'118/76',o2:98,hr:72,temp:'36,6'},{id:'02',name:'Astronauta 02',initial:'A2',pa:'120/78',o2:97,hr:76,temp:'36,5'},{id:'03',name:'Astronauta 03',initial:'A3',pa:'114/74',o2:98,hr:69,temp:'36,7'},{id:'04',name:'Astronauta 04',initial:'A4',pa:'116/75',o2:99,hr:71,temp:'36,6'}];
const current=()=>crewData.find(c=>c.id===crew);
const personal=()=>records.filter(r=>r.crew===crew).sort((a,b)=>b.at.localeCompare(a.at));
function persist(){try{localStorage.setItem('kawsay-ui-v1',JSON.stringify({records,alertStates,draft}));storageOK=true;return true}catch{storageOK=false;return false}}
function toast(t){$('#toast').textContent=t;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').textContent='',4500)}
const stamp=at=>new Date(at).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'});
const dateLabel='Día de misión 20 · Muestra 14:20';
function astronaut(){return `<svg class="astronaut" viewBox="0 0 260 460" role="img" aria-label="Ilustración del astronauta con traje completo"><defs><linearGradient id="suit" x1="0" x2="1"><stop stop-color="#8da2b6"/><stop offset=".4" stop-color="#eef6ff"/><stop offset="1" stop-color="#748da4"/></linearGradient><linearGradient id="visor" x2=".8" y2="1"><stop stop-color="#284155"/><stop offset=".6" stop-color="#06111f"/><stop offset="1" stop-color="#927956"/></linearGradient></defs><ellipse cx="130" cy="440" rx="95" ry="12" fill="#143c4d" stroke="#36e2e5"/><g fill="url(#suit)" stroke="#496478" stroke-width="2"><rect x="72" y="128" width="116" height="130" rx="30" fill="#637d94"/><path d="M86 126 63 145 45 225 37 266q-2 14 13 17l14-5 20-67 6-26M174 126l23 19 18 80 8 41q2 14-13 17l-14-5-20-67-6-26"/><rect x="79" y="127" width="102" height="145" rx="29"/><path d="m86 259-8 75-6 75 38 4 18-131h5l17 131 38-4-6-75-9-75z"/><path d="M73 400h37l1 26q-23 17-48 4zM150 400h38l10 30q-25 13-50-4z"/><rect x="84" y="85" width="93" height="60" rx="25"/><ellipse cx="130" cy="78" rx="49" ry="56"/><rect x="88" y="45" width="84" height="67" rx="32" fill="url(#visor)"/><path d="M100 58q20-18 43-8" fill="none" stroke="#c2e0ed" stroke-width="4"/><rect x="95" y="158" width="72" height="64" rx="10" fill="#536f83"/><rect x="104" y="167" width="54" height="24" rx="4" fill="#112638"/><path d="M108 181h8l4-7 6 10 4-6h20" fill="none" stroke="#36e2e5"/><path d="M107 201h9m12 0h9m10 0h5" stroke="#ecf4f8" stroke-width="4"/><path d="M81 237h99M83 245h95M78 330h39M143 330h40M48 230l22 5M190 235l23-5" fill="none" stroke="#4c647a" stroke-width="5"/><path d="M161 213q38 14 15 65" fill="none" stroke="#b1c1c7" stroke-width="8"/></g><circle cx="${zone==='Muslo'?99:130}" cy="${zone==='Muslo'?308:zone==='Tórax'?189:78}" r="20" fill="#36e2e522" stroke="#36e2e5"/><circle cx="${zone==='Muslo'?99:130}" cy="${zone==='Muslo'?308:zone==='Tórax'?189:78}" r="7" fill="#36e2e5"/></svg>`}
function chart(kind='o2'){const lact=kind==='lactate',week=period==='week';const labels=lact?['Antes','Al terminar','Recuperación']:week?['Lun','Mar','Mié','Jue','Vie','Sáb']:['09:00','10:00','11:00','12:00','13:00','14:00'];return `<svg class="chart" viewBox="0 0 540 200" role="img" aria-label="${lact?'Lactato: antes 1,2; al terminar 4,1; recuperación 3,2 milimoles por litro':week?'Saturación simulada de lunes a sábado: 98, 97, 98, 99, 98, 98 por ciento':'Saturación simulada: 98, 97, 98, 98, 99, 98 por ciento'}"><defs><linearGradient id="area" x2="0" y2="1"><stop stop-color="#36e2e5" stop-opacity=".2"/><stop offset="1" stop-color="#36e2e5" stop-opacity="0"/></linearGradient></defs>${[30,70,110,150].map((y,i)=>`<path class="gridline" d="M45 ${y}H520"/><text x="8" y="${y+4}">${lact?5-i:100-i*2}</text>`).join('')}<path d="${lact?'M70 140 280 48 490 78':week?'M50 70 140 90 230 70 320 50 410 70 500 70':'M50 70 140 90 230 70 320 70 410 50 500 70'} L500 160H50Z" fill="url(#area)"/><path class="curve" d="${lact?'M70 140 280 48 490 78':week?'M50 70 140 90 230 70 320 50 410 70 500 70':'M50 70 140 90 230 70 320 70 410 50 500 70'}"/>${labels.map((l,i)=>`<text text-anchor="middle" x="${lact?70+i*210:50+i*90}" y="185">${l}</text>`).join('')}</svg>`}
function metric(title,value,unit,key,origin='Simulación · muestra 14:20'){return `<button class="card metric" data-metric="${key}">${icon(key)}<p>${title}</p><div class="value">${value} <small>${unit}</small></div><small>${origin}</small><svg class="spark" viewBox="0 0 240 25" aria-hidden="true"><path d="M0 17 20 15 35 19 50 9 65 14 90 12 110 18 135 9 155 14 175 10 195 14 220 11 240 13"/></svg></button>`}
function metrics(){const c=current();return `<div class="metrics">${metric('Presión arterial',c.pa,'mmHg','pressure')}${metric('Saturación de oxígeno',c.o2,'%','oxygen')}${metric('Frecuencia cardíaca',c.hr,'lpm','heart')}${metric('Temperatura',c.temp,'°C','temp')}</div>`}
function nav(){const items=role==='astronauta'?[['home','home','Inicio'],['report','report','Reportar'],['alerts','alert','Alertas'],['analysis','analysis','Análisis'],['explore','body','Exploración'],['history','history','Historial']]:[['home','crew','Tripulación'],['patient','heart','Detalle'],['alerts','alert','Alertas'],['analysis','analysis','Análisis'],['explore','body','Exploración'],['history','history','Historial']];$('#nav').innerHTML=items.map(([p,i,t],idx)=>`<button data-page="${p}" class="${idx>3?'secondary-nav':''}" ${page===p?'aria-current="page"':''}>${icon(i)}<span>${t}</span></button>`).join('')+`<div class="nav-note">Prototipo de interfaz<br><br>Datos de ejemplo, separados de los módulos de sensores y del análisis con IA.</div>`}
function heading(title,desc){return `<div class="page-head"><div><p class="eyebrow">${role==='medico'?'Centro médico · ':''}${current().name}</p><h1>${title}</h1><p>${desc}</p></div><span class="badge ${navigator.onLine?'':'amber'}">${navigator.onLine?'Vista local':'Sin conexión'}</span></div>`}
const goto=(p,label,primary=false)=>`<button data-page="${p}" class="${primary?'primary':''}">${label}</button>`;
function pending(id=crew){return records.filter(r=>r.crew===id&&r.type==='Síntomas'&&(alertStates[r.id]||'pending')!=='closed').length}
function home(){return heading(role==='medico'?'Salud de la tripulación':'Mi estado',role==='medico'?'Selecciona un tripulante para consultar sus registros.':'Tu resumen de salud, en un solo lugar.')+(role==='medico'?`<div class="crew">${crewData.map(c=>`<button class="card ${c.id===crew?'selected':''}" data-crew="${c.id}"><div class="avatar">${c.initial}</div><h3>${c.name}</h3><small>PA ${c.pa} · SpO₂ ${c.o2}%</small><br><span class="badge ${pending(c.id)?'amber':''}">${pending(c.id)?pending(c.id)+' reporte(s) por revisar':'Sin reportes pendientes'}</span></button>`).join('')}</div>`:'')+metrics()+`<div class="grid"><section class="card summary"><p class="eyebrow">${role==='medico'?'Seguimiento del tripulante':'Tu resumen'}</p><h2>${pending()?'Tienes un reporte pendiente de revisión':'Sin alertas activas en esta demo'}</h2><p class="muted">${pending()?'Se ha registrado un síntoma. Consulta el detalle y registra su seguimiento.':'La muestra de demostración está disponible. Esta pantalla no evalúa riesgos clínicos.'}</p><small>${dateLabel} · Datos fijos de ejemplo</small><div class="actions">${role==='medico'?goto('patient','Ver detalle',true):goto('report','Registrar cómo me siento',true)}${goto('alerts','Ver alertas')}</div></section><section class="card mini-earth">${astronaut()}<div><p class="eyebrow">Exploración corporal</p><h2>Conoce tus registros</h2><p class="muted">Selecciona una zona del traje para ampliar su información.</p>${goto('explore','Explorar mi estado')}</div></section><section class="card"><div class="row"><h2>Evolución de SpO₂</h2><small>Ejemplo · %</small></div>${chart()}${goto('history','Ver historial')}</section><section class="card"><p class="eyebrow">${role==='medico'?'Último registro':'Tu seguimiento'}</p><h2>${personal()[0]?esc(personal()[0].type):'¿Cómo te sientes hoy?'}</h2><p class="muted">${personal()[0]?esc(recordSummary(personal()[0])):'Registra síntomas, descanso o actividad para completar tu información.'}</p><div class="actions">${goto('analysis','Ver análisis')}${goto('history','Consultar historial')}</div><p style="margin-top:18px"><small>Las mediciones, los reportes y las alertas conservan su procedencia.</small></p></section></div>`}
function recordSummary(r){return r.type==='Síntomas'?`${r.symptom} · ${r.zone} · ${r.intensity}/10`:r.type==='Sueño'?`${r.sleep} horas de descanso`:r.type==='Actividad'?r.activity:`${r.measurement} ${r.unit}`}
function report(){return heading('Reporte manual','Cuéntanos cómo te sientes.')+`<section class="card form-shell"><div class="tabs" role="tablist" aria-label="Tipo de reporte">${['Síntomas','Sueño','Actividad','Medición'].map(t=>`<button role="tab" data-type="${t}" aria-selected="${draft.type===t}">${t}</button>`).join('')}</div><form id="report-form"><p class="muted">${current().name} · Registro manual de demostración</p><div class="form-grid">${draft.type==='Síntomas'?`<label class="field">Síntoma<select name="symptom">${['Fatiga muscular','Dolor de cabeza','Mareo','Otro síntoma'].map(v=>`<option ${draft.symptom===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Zona<select name="zone">${['Muslo derecho','Muslo izquierdo','Tórax','Cabeza','General'].map(v=>`<option ${draft.zone===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field wide"><span class="row"><span>Intensidad</span><output id="intensity-value">${esc(draft.intensity)}/10</output></span><input name="intensity" type="range" min="0" max="10" value="${esc(draft.intensity)}"></label><label class="field wide">¿Desde cuándo?<input name="since" value="${esc(draft.since)}" placeholder="Ej. hace 30 minutos" maxlength="100" required></label>`:draft.type==='Sueño'?`<label class="field wide">Horas de sueño<input name="sleep" type="number" min="0" max="24" step="0.5" required value="${esc(draft.sleep)}"></label>`:draft.type==='Actividad'?`<label class="field wide">Actividad realizada<input name="activity" required maxlength="160" value="${esc(draft.activity)}" placeholder="Ej. 20 minutos de bicicleta"></label>`:`<label class="field">Valor de la medición<input name="measurement" value="${esc(draft.measurement)}" required maxlength="40" placeholder="Ej. 118/76"></label><label class="field">Unidad<select name="unit">${['mmHg','%','lpm','°C','mmol/L'].map(v=>`<option ${draft.unit===v?'selected':''}>${v}</option>`).join('')}</select></label>`}<label class="field wide">Observaciones (opcional)<textarea name="notes" maxlength="1000" placeholder="Añade contexto a tu reporte">${esc(draft.notes)}</textarea></label></div><div class="actions"><button class="primary" type="submit">Guardar reporte</button></div><p style="margin-top:14px"><small>Se guardará en este navegador y para este tripulante. No se envía a un equipo médico.</small></p></form></section>`}
function alerts(){const all=records.filter(r=>r.type==='Síntomas'&&(role==='medico'||r.crew===crew));const list=all.filter(r=>alertFilter==='all'||(alertStates[r.id]||'pending')===alertFilter);return heading('Alertas y seguimiento','Reportes de síntomas pendientes de revisión; sin clasificación clínica automática.')+`<div class="toolbar"><label for="alert-filter">Mostrar</label><select id="alert-filter"><option value="all">Todos los estados</option><option value="pending">Pendientes</option><option value="reviewed">Revisados</option><option value="closed">Cerrados</option></select></div><section class="card">${list.length?list.slice().reverse().map(r=>`<article class="list-row"><div class="row"><h3>${esc(r.symptom)}</h3><span class="badge amber">${({pending:'Pendiente',reviewed:'Revisado',closed:'Cerrado'})[alertStates[r.id]||'pending']}</span></div><p>${esc(r.zone)} · Intensidad ${esc(r.intensity)}/10</p><small>Astronauta ${esc(r.crew)} · Reporte manual · ${stamp(r.at)}</small><div class="actions"><button data-alert="${esc(r.id)}">Ver detalle</button>${role==='medico'?`<button data-review="${esc(r.id)}" class="primary">${(alertStates[r.id]||'pending')==='pending'?'Marcar revisado':alertStates[r.id]==='reviewed'?'Cerrar seguimiento':'Reabrir seguimiento'}</button>`:goto('report','Registrar seguimiento')}</div></article>`).join(''):`<div class="empty">${icon('check')}<h2>No hay reportes en este estado</h2><p class="muted">Los síntomas que registres aparecerán aquí para su seguimiento.</p>${goto('report','Crear reporte de demostración',true)}</div>`}</section>`}
function analysis(){const last=personal()[0];return heading('Análisis y recomendaciones','Resumen del registro disponible y próximos pasos.')+`<div class="grid"><section class="card summary"><p class="eyebrow">Resumen de interfaz · Sin LLM conectado</p><h2>${last?esc(recordSummary(last)):'Aún no has registrado cómo te sientes'}</h2><p class="muted">${last?'Este resumen reproduce tu reporte manual; no es una interpretación médica.':'Completa un reporte para ver aquí tu información de seguimiento.'}</p><small>${last?stamp(last.at):dateLabel}</small><h3 style="margin-top:24px">Información disponible</h3><p>${last?'Reporte manual de '+esc(last.type.toLowerCase()):'Muestra fija de signos vitales simulados'}</p><p class="muted">Las muestras simuladas y los reportes actuales usan tiempos distintos y no se combinan en una valoración.</p></section><section class="card"><h2>Próximos pasos</h2><ol class="steps"><li><span class="num">1</span>Registrar la evolución de tus síntomas.</li><li><span class="num">2</span>Consultar tus registros previos.</li><li><span class="num">3</span>Revisar el protocolo de la misión.</li></ol><div class="actions">${goto('report','Registrar evolución',true)}${goto('history','Ver historial')}</div></section><section class="card"><span class="badge amber">Información pendiente</span><h2 style="margin-top:16px">Sin medición reciente de lactato</h2><p class="muted">La exploración incluye un ejemplo independiente de lactato. No representa una medición actual ni indica una zona muscular de origen.</p>${goto('explore','Explorar mi estado')}</section><section class="card"><h2>${role==='medico'?'Valoración del profesional':'Protocolo de misión'}</h2><p class="muted">${role==='medico'?'Revisa los reportes y documenta el seguimiento desde la sección Alertas.':'El protocolo clínico del equipo todavía no está incorporado a esta maqueta.'}</p><button data-protocol>Consultar disponibilidad</button></section></div>`}
function explore(){return heading('Exploración corporal','Toca una zona del traje o un indicador para ampliar el detalle.')+`<div class="explore"><section class="card"><div class="row"><h2>${current().name}</h2><span class="badge">Vista interactiva</span></div><div class="stage">${astronaut()}${['Cabeza','Tórax','Muslo'].map(z=>`<button class="zone ${zone===z?'active':''}" data-zone="${z}" aria-pressed="${zone===z}">${z==='Muslo'?'Muslo derecho':z}</button>`).join('')}</div><div class="actions">${goto('history','Ver registros')}${goto('report','Reportar molestia',true)}</div></section><div class="stack"><section class="card"><p class="eyebrow">Zona seleccionada</p><h2>${zone==='Muslo'?'Muslo derecho':zone}</h2><div class="toggle"><button data-layer="Traje" aria-pressed="${layer==='Traje'}">Traje</button><button data-layer="Anatomía" aria-pressed="${layer==='Anatomía'}">Anatomía</button></div>${layer==='Traje'?`<div style="height:200px;overflow:hidden;text-align:center">${astronaut()}</div>`:`<svg class="anatomy" viewBox="0 0 300 180" role="img" aria-label="Esquema anatómico de ${zone==='Muslo'?'cuádriceps':zone==='Tórax'?'músculos pectorales':'región de la cabeza'}"><g fill="#bd7e79" stroke="#e9b8ac" stroke-width="2">${zone==='Muslo'?'<path d="M114 10q-30 65-8 125l25 35 11-45-5-105z"/><path d="M143 15q46 70 25 123l-24 33-6-45z"/><path d="m119 25-4 95 15 31m24-123 7 92-15 35" fill="none"/>':zone==='Tórax'?'<path d="M145 30q-70-30-95 30l30 65 65-35zM155 30q70-30 95 30l-30 65-65-35z"/>':'<ellipse cx="150" cy="78" rx="47" ry="60"/><path d="M130 135v35h40v-35"/>'}</g><text x="150" y="178" text-anchor="middle" fill="#eef5fc" font-size="12">${zone==='Muslo'?'Cuádriceps · esquema ilustrativo':zone==='Tórax'?'Pectorales · esquema ilustrativo':'Cabeza · esquema ilustrativo'}</text></svg>`}<small>Ilustración esquemática; la selección no equivale a un hallazgo clínico.</small></section><section class="card"><div class="row"><h2>Lactato sanguíneo</h2><span class="badge amber">Ejemplo manual</span></div><div class="value" style="font-size:30px;color:var(--cyan)">3,2 mmol/L</div><small>Muestra capilar de ejemplo · recuperación tras ejercicio</small>${chart('lactate')}<p class="muted">Medición sanguínea, sin localización muscular. Ejemplo separado de los registros del tripulante.</p></section></div></div>`}
function history(){let list=personal();if(period==='today'){const today=new Date().toLocaleDateString();list=list.filter(r=>new Date(r.at).toLocaleDateString()===today)}else list=list.filter(r=>Date.now()-new Date(r.at).getTime()<7*86400000);return heading('Historial y evolución','Consulta los registros de este tripulante y su procedencia.')+`<div class="toolbar"><button data-period="today" aria-pressed="${period==='today'}">Hoy</button><button data-period="week" aria-pressed="${period==='week'}">7 días</button><button data-export>Exportar reportes JSON</button></div><div class="grid"><section class="card"><h2>SpO₂ · tendencia de ejemplo</h2>${chart()}<small>${period==='week'?'Serie semanal ilustrativa':'Serie horaria ilustrativa'} · No procede de tus reportes.</small></section><section class="card"><h2>Reportes manuales</h2>${list.length?list.map(r=>`<article class="list-row"><h3>${esc(recordSummary(r))}</h3><small>${stamp(r.at)} · Manual</small><p class="muted">${esc(r.notes||'Sin observaciones adicionales.')}</p></article>`).join(''):'<p class="muted">Sin registros para este período.</p>'}</section></div>`}
function patient(){return heading('Detalle del astronauta','Mediciones y contexto del tripulante seleccionado.')+`<div class="toolbar"><label for="crew-select">Tripulante</label><select id="crew-select">${crewData.map(c=>`<option value="${c.id}" ${crew===c.id?'selected':''}>${c.name}</option>`).join('')}</select></div>`+metrics()+`<div class="grid"><section class="card"><h2>Contexto de la misión</h2><div class="list-row row"><span>Identificación</span><strong>DEMO-${crew}</strong></div><div class="list-row row"><span>Muestra</span><span>Día 20 · 14:20</span></div><div class="list-row row"><span>Procedencia</span><span>Valores ilustrativos</span></div><p class="muted" style="margin-top:15px">Antecedentes clínicos y sensores reales pendientes de integración.</p></section><section class="card"><h2>Seguimiento</h2><p>${personal().length} reporte(s) manual(es) · ${pending()} pendiente(s).</p><div class="actions">${goto('alerts','Revisar reportes',true)}${goto('analysis','Consultar análisis')}${goto('history','Historial')}${goto('explore','Exploración corporal')}</div></section></div>`}
function render(focus=false){nav();document.querySelectorAll('[data-role]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.role===role));$('#main').innerHTML=(!storageOK?'<div class="storage-warning" role="status">Almacenamiento local no disponible. Los cambios se conservan solo durante esta sesión.</div>':'')+({home,report,alerts,analysis,explore,history,patient}[page]||home)()+`<footer class="footer">KAWSAY · Prototipo HTML · Datos simulados · Cambio de perfil de demostración, sin autenticación</footer>`;if(page==='alerts')$('#alert-filter').value=alertFilter;if(focus){$('#main').focus();window.scrollTo({top:0,behavior:'instant'})}}
function modal(content){$('#detail-body').innerHTML=content;$('#detail').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.role){role=d.role;page='home';render(true)}else if(d.page){page=d.page;render(true)}else if(d.crew){crew=d.crew;render()}else if(d.type){draft.type=d.type;persist();render()}else if(d.zone){zone=d.zone;render()}else if(d.layer){layer=d.layer;render()}else if(d.period){period=d.period;render()}else if(d.metric){const c=current();const titles={pressure:['Presión arterial',c.pa+' mmHg'],oxygen:['Saturación de oxígeno',c.o2+' %'],heart:['Frecuencia cardíaca',c.hr+' lpm'],temp:['Temperatura',c.temp+' °C']};modal(`<p class="eyebrow">Detalle del indicador</p><h2>${titles[d.metric][0]}</h2><h1>${titles[d.metric][1]}</h1><p>Procedencia: simulación fija de interfaz.</p><p class="muted">${dateLabel}. No es una medición en tiempo real.</p>`)}else if(d.alert){const r=records.find(r=>r.id===d.alert);modal(`<p class="eyebrow">${esc('Astronauta '+r.crew)} · Reporte manual</p><h2>${esc(r.symptom)}</h2><p>${esc(r.zone)} · Intensidad ${esc(r.intensity)}/10</p><p>Inicio referido: ${esc(r.since)}</p><p>${esc(r.notes||'Sin observaciones adicionales.')}</p><small>${stamp(r.at)}</small><p class="muted" style="margin-top:18px">Pendiente de valoración según el protocolo del equipo. El registro de síntomas no establece una prioridad clínica.</p>`)}else if(d.review){const prev=alertStates[d.review]||'pending';alertStates[d.review]=prev==='pending'?'reviewed':prev==='reviewed'?'closed':'pending';persist();render();toast('Estado del seguimiento actualizado en este navegador.')}else if('protocol'in d){modal('<h2>Protocolo de misión</h2><p>El equipo debe incorporar aquí su protocolo validado y sus canales de comunicación.</p><p class="muted">Este prototipo todavía no contiene procedimientos clínicos ni envía solicitudes de ayuda.</p>')}else if('export'in d){const blob=new Blob([JSON.stringify({demo:true,crew:'DEMO-'+crew,records:personal(),alertStates},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='kawsay-reportes-'+crew+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
$('#close-detail').addEventListener('click',()=>$('#detail').close());
document.addEventListener('input',e=>{if(e.target.closest('#report-form')&&e.target.name){draft[e.target.name]=e.target.value;if(e.target.name==='intensity')$('#intensity-value').textContent=e.target.value+'/10';persist()}});
document.addEventListener('change',e=>{if(e.target.id==='crew-select'){crew=e.target.value;render()}if(e.target.id==='alert-filter'){alertFilter=e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='report-form')return;e.preventDefault();const form=e.target;for(const [k,v]of new FormData(form))draft[k]=String(v).trim();if(draft.type==='Síntomas'&&!draft.since||draft.type==='Actividad'&&!draft.activity||draft.type==='Medición'&&!draft.measurement){toast('Completa el campo requerido.');return}records.push({...draft,id:globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random(),crew,at:new Date().toISOString()});draft.notes='';const saved=persist();page='history';period='today';render(true);toast(saved?'Reporte guardado en este navegador.':'Reporte disponible durante esta sesión; no se pudo guardar de forma permanente.')});
window.addEventListener('online',()=>render());window.addEventListener('offline',()=>render());
render();
</script>
</body></html>
