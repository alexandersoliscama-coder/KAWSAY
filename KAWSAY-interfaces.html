const triIn=(path,label,val,attrs='')=>`<label class="field">${label}<input data-tri="${path}" value="${esc(val)}" ${attrs}></label>`;
function triList(key,title,hint,rowHtml){const L=TRI_LISTS[key],d=tri.d,none=d[L.none],rows=d[L.list];return `<section class="tri-sec"><h2>${title}</h2><p class="muted">${hint}</p><label class="check"><input type="checkbox" data-tri-none="${key}" ${none?'checked':''}> ${({history:'No known history',meds:'No regular medication',reacts:'No known adverse reactions'})[key]}</label>${none?'':rows.map((r,i)=>`<div class="tri-row">${rowHtml(r,i)}${rows.length>1?`<button type="button" class="ghost" data-tri-del="${key}.${i}" aria-label="Remove item ${i+1}">Remove</button>`:'<span></span>'}</div>`).join('')+`<div class="actions"><button type="button" data-tri-add="${key}">+ Add item</button></div>`}</section>`}
function triListHtml(){if(tri.listError)return `<div class="storage-warning" role="alert">${esc(tri.listError)}</div>`;if(!tri.loaded)return '<div class="loading" role="status"><span class="spin" aria-hidden="true"></span><span>Loading triages from the database…</span></div>';if(!tri.list.length)return '<p class="muted">No triages saved yet.</p>';return tri.list.map(t=>`<article class="list-row"><div class="row"><h3>${esc(t.full_name)} <small>(${esc(t.patient_id)})</small></h3><span class="badge">No. ${esc(t.triage_id)}</span></div><p>${esc(t.age)} y · ${t.sex==='female'?'Female':'Male'} · HR ${esc(t.hr)} · RR ${esc(t.rr)} · SpO₂ ${esc(t.spo2)}% · ${esc(t.temp)} °C · ${esc(t.sbp)}/${esc(t.dbp)} mmHg</p><small>${stamp(t.recorded_at)}</small><div class="actions"><button type="button" data-tri-view="${esc(t.triage_id)}">View details</button></div></article>`).join('')}
function triagePage(){const d=tri.d;return `<div class="page-head"><div><p class="eyebrow">Medical center</p><h1>Triage (on admission)</h1><p>First record of the patient. Every field is required.</p></div><span class="badge ${navigator.onLine?'':'amber'}">${navigator.onLine?'Local view':'Offline'}</span></div><section class="card form-shell"><form id="triage-form" novalidate>${tri.error?`<div class="storage-warning" id="tri-error" role="alert" tabindex="-1">${esc(tri.error)}</div>`:''}
<section class="tri-sec"><h2>1. Identification data</h2><div class="form-grid">${triIn('full_name','Name',d.full_name,'required maxlength="120" autocomplete="off" placeholder="E.g. Ana Demo"')}${triIn('patient_id','Patient ID',d.patient_id,'required maxlength="64" autocomplete="off" placeholder="E.g. PAT-001"')}${triIn('age','Age (years)',d.age,'required type="number" inputmode="numeric" min="0" max="120" step="1" placeholder="E.g. 34"')}<label class="field">Sex<select data-tri="sex" required><option value="">Select…</option><option value="female" ${d.sex==='female'?'selected':''}>Female</option><option value="male" ${d.sex==='male'?'selected':''}>Male</option></select></label></div></section>
${triList('history','2. Medical history (ICD-10)','Personal and family history, coded with ICD-10.',(r,i)=>`<label class="field">Type<select data-tri="history.${i}.kind"><option value="personal" ${r.kind==='personal'?'selected':''}>Personal</option><option value="family" ${r.kind==='family'?'selected':''}>Family</option></select></label>${triIn('history.'+i+'.code','ICD-10 code',r.code,'required maxlength="8" autocomplete="off" placeholder="E.g. I10"')}${triIn('history.'+i+'.description','Description (optional)',r.description,'maxlength="200" autocomplete="off" placeholder="E.g. Hypertension"')}`)}
${triList('meds','3. Regular medication','Medicines the patient always takes.',(r,i)=>`${triIn('meds.'+i+'.name','Medicine',r.name,'required maxlength="120" autocomplete="off" placeholder="E.g. Losartan"')}${triIn('meds.'+i+'.dose','Dose (optional)',r.dose,'maxlength="80" autocomplete="off" placeholder="E.g. 50 mg"')}${triIn('meds.'+i+'.frequency','Frequency (optional)',r.frequency,'maxlength="80" autocomplete="off" placeholder="E.g. once daily"')}`)}
${triList('reacts','4. Adverse drug reactions','Adverse reactions to medicines.',(r,i)=>`${triIn('reacts.'+i+'.drug','Medicine',r.drug,'required maxlength="120" autocomplete="off" placeholder="E.g. Penicillin"')}${triIn('reacts.'+i+'.reaction','Reaction',r.reaction,'required maxlength="200" autocomplete="off" placeholder="E.g. Skin rash"')}<span></span>`)}
<section class="tri-sec"><h2>5. Vital signs</h2><div class="form-grid">${TRI_VITALS.map(([k,l,min,max,step,ph])=>triIn(k,l,d[k],`required type="number" inputmode="${step===1?'numeric':'decimal'}" min="${min}" max="${max}" step="${step}" placeholder="${ph}"`)).join('')}</div></section>
<div class="actions"><button class="primary" type="submit" ${tri.saving?'disabled':''}>${tri.saving?'Saving…':'Save triage'}</button></div><p style="margin-top:14px"><small>Saved to the SQL database (first patient table). Synthetic data only: do not enter real patient data.</small></p></form></section><section class="card form-shell" style="margin-top:18px"><h2>Saved triages</h2><div id="tri-list">${triListHtml()}</div></section>`}
function triRefreshList(){const el=$('#tri-list');if(el)el.innerHTML=triListHtml()}
async function triLoad(){tri.loading=true;try{tri.list=(await triFetch('/demo-api/api/v1/triage?limit=50')).triage;tri.listError=''}catch(e){tri.listError=e.message}tri.loaded=true;tri.loading=false;triRefreshList()}
async function triSubmit(){if(tri.saving)return;const err=triCheck(tri.d);tri.error=err;if(err){render();const el=$('#tri-error');if(el){el.scrollIntoView({block:'center'});el.focus()}return}
tri.saving=true;render();try{const r=await triFetch('/demo-api/api/v1/triage',triPayload(tri.d));tri.d=triBlank();tri.saving=false;tri.loaded=false;render(true);toast('Triage saved to the SQL database (no. '+r.triage_id+').')}catch(e){tri.saving=false;tri.error=e.message;render();const el=$('#tri-error');if(el){el.scrollIntoView({block:'center'});el.focus()}}}
function triSet(path,v){const p=path.split('.');if(p.length===1)tri.d[p[0]]=v;else tri.d[p[0]][Number(p[1])][p[2]]=v}
function triView(id){const t=tri.list.find(x=>String(x.triage_id)===String(id));if(!t)return;const li=a=>a.length?'<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<p class="muted">None reported.</p>';modal(`<p class="eyebrow">Triage no. ${esc(t.triage_id)} · ${stamp(t.recorded_at)}</p><h2>${esc(t.full_name)} <small>(${esc(t.patient_id)})</small></h2><p>${esc(t.age)} years · ${t.sex==='female'?'Female':'Male'}</p><h3>Medical history (ICD-10)</h3>${li(t.history.map(h=>(h.kind==='family'?'Family':'Personal')+' · <strong>'+esc(h.code)+'</strong>'+(h.description?' · '+esc(h.description):'')))}<h3>Regular medication</h3>${li(t.medications.map(m=>'<strong>'+esc(m.name)+'</strong>'+(m.dose?' · '+esc(m.dose):'')+(m.frequency?' · '+esc(m.frequency):'')))}<h3>Adverse drug reactions</h3>${li(t.adverse_reactions.map(r=>'<strong>'+esc(r.drug)+'</strong> · '+esc(r.reaction)))}<h3>Vital signs</h3><p>HR ${esc(t.hr)} bpm · RR ${esc(t.rr)}/min · SpO₂ ${esc(t.spo2)}% · ${esc(t.temp)} °C · BP ${esc(t.sbp)}/${esc(t.dbp)} mmHg</p>`)}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.tri&&t.closest('#triage-form'))triSet(t.dataset.tri,t.value)});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset&&t.dataset.triNone;if(!k)return;const L=TRI_LISTS[k];tri.d[L.none]=t.checked;tri.d[L.list]=t.checked?[]:[L.blank()];render()});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.triAdd){const L=TRI_LISTS[d.triAdd];tri.d[L.list].push(L.blank());render();const n=tri.d[L.list].length-1,el=document.querySelector(`[data-tri="${L.list}.${n}.${L.first}"]`);if(el)el.focus()}else if(d.triDel){const [k,i]=d.triDel.split('.');tri.d[TRI_LISTS[k].list].splice(Number(i),1);render()}else if(d.triView)triView(d.triView)});
document.addEventListener('submit',e=>{if(e.target.id==='triage-form'){e.preventDefault();triSubmit()}});
function modal(content){$('#detail-body').innerHTML=content;$('#detail').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.role){role=d.role;page='home';render(true)}else if(d.page){page=d.page;mon.msg='';mon.error='';render(true)}else if(d.crew){crew=d.crew;render()}else if(d.type){draft.type=d.type;persist();render()}else if(d.zone){zone=d.zone;render()}else if(d.layer){layer=d.layer;render()}else if(d.period){period=d.period;render()}else if(d.metric){const v=vals();const titles={pressure:['Blood pressure',fmt(v.sbp)+'/'+fmt(v.dia)+' mmHg'],oxygen:['Oxygen saturation',fmt(v.spo2)+' %'],heart:['Heart rate',fmt(v.hr)+' bpm'],temp:['Temperature',fmt(v.temp,1)+' °C']};modal(`<p class="eyebrow">Indicator details</p><h2>${titles[d.metric][0]}</h2><h1>${titles[d.metric][1]}</h1><p>Provenance: ${source==='watch'?'value copied manually from the smartwatch; not verified with another instrument':'synthetic series from the data generator; the series does not include diastolic pressure'}.</p><p class="muted">${srcLabel()}. It is not a real-time measurement.</p>`)}else if(d.alert){alertDetail(d.alert)}else if(d.review){const prev=alertStates[d.review]||'pending';alertStates[d.review]=prev==='pending'?'reviewed':prev==='reviewed'?'closed':'pending';persist();render();toast('Follow-up status updated in this browser.')}else if('protocol'in d){modal('<h2>Mission protocol</h2><p>The team must add its validated protocol and communication channels here.</p><p class="muted">This prototype does not yet contain clinical procedures nor send requests for help.</p>')}else if(d.source){source=d.source;persist();if(source==='watch'&&playTimer)togglePlay();else render()}else if('send'in d){sendSample()}else if('askreport'in d){askReport()}else if('play'in d){togglePlay()}else if('export'in d){const blob=new Blob([JSON.stringify({demo:true,crew:'DEMO-'+crew,records:personal(),alertStates},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='kawsay-reports-'+crew+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
$('#close-detail').addEventListener('click',()=>$('#detail').close());
document.addEventListener('input',e=>{if(e.target.closest('#report-form')&&e.target.name){draft[e.target.name]=e.target.value;if(e.target.name==='intensity')$('#intensity-value').textContent=e.target.value+'/10';persist()}});
document.addEventListener('change',e=>{if(e.target.id==='crew-select'){crew=e.target.value;render()}if(e.target.id==='sim-day'||e.target.id==='sim-hour'){const dv=parseInt($('#sim-day').value,10),hv=parseInt($('#sim-hour').value,10);sim.day=Math.min(29,Math.max(0,(isNaN(dv)?sim.day+1:dv)-1));sim.hour=Math.min(23,Math.max(0,isNaN(hv)?sim.hour:hv));render()}if(e.target.id==='alert-filter'){alertFilter=e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='emergency-form'){e.preventDefault();saveEmergency(new FormData(e.target));return}if(e.target.id!=='report-form')return;e.preventDefault();const form=e.target;for(const [k,v]of new FormData(form))draft[k]=String(v).trim();if(draft.type==='Smartwatch'){for(const k of VK)draft['fail_'+k]=form.elements['fail_'+k]&&form.elements['fail_'+k].checked?'1':'';saveDaily();return}if(draft.type==='Symptoms'&&!draft.since||draft.type==='Activity'&&!draft.activity||draft.type==='Measurement'&&!draft.measurement){toast('Fill in the required field.');return}records.push({...draft,id:globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random(),crew,at:new Date().toISOString()});draft.notes='';const saved=persist();page='history';period='today';render(true);toast(saved?'Report saved in this browser.':'Report available during this session; it could not be saved permanently.')});
window.addEventListener('online',()=>render());window.addEventListener('offline',()=>render());
recoverDaily();aiRecover();render();loadData();
// NEWS2 engine (dist/engine.js): loaded separately so startup does not depend on it; the page is redrawn when it arrives.
{const es=document.createElement('script');es.src='/engine.js';es.onload=()=>render();es.onerror=()=>render();document.head.appendChild(es)}
</script>
</body></html>
